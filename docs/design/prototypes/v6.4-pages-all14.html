<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>v6.4 全页面原型 · P2-P14（布局语言=v6.4-p1-final v2.1：8pt 栅格/字阶 token/面板规格）</title>
<style>
  :root{--bg:#f5f1e8;--panel:#fbf8f1;--wood:#b07a45;--wood-d:#8a5a2e;--ink:#2c2418;--ink2:#6b5d48;
    --line:#e2d9c8;--line2:#d4c8b0;--accent:#b03a2e;--gold:#c9a227;--ok:#3a7d44;
    --s1:4px;--s2:8px;--s3:16px;--s4:24px;
    --p-radius:10px;--p-head-h:32px;--fs-cap:12px;--fs-body:13px;--fs-title:15px;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;overflow:hidden}
  #nav{position:fixed;top:0;left:0;bottom:0;width:150px;background:var(--ink);z-index:99;display:flex;flex-direction:column;padding:12px 8px;gap:3px;overflow:auto}
  #nav .brand{color:var(--gold);font-size:12px;font-weight:700;padding:4px 8px 10px}
  #nav button{border:none;background:none;color:#cfc4ac;font-size:12px;text-align:left;padding:6px 10px;border-radius:7px;cursor:pointer;line-height:1.4}
  #nav button:hover{background:rgba(255,255,255,.08)}
  #nav button.on{background:var(--gold);color:var(--ink);font-weight:600}
  .stage{position:fixed;inset:0 0 0 150px;display:flex;flex-direction:column}
  .page{display:none;flex-direction:column;height:100vh}
  .page.on{display:flex}
  .titlebar{height:32px;background:#e9e2d2;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--ink2);gap:8px;flex:none}
  .dot{width:9px;height:9px;border-radius:50%;background:#d0c6b0}
  .toolbar{height:48px;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s3);background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  .tb{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:var(--fs-body);display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;transition:all .12s}
  .tb:hover{border-color:var(--wood);background:#fdf7ee;transform:translateY(-1px);box-shadow:0 2px 6px rgba(138,90,46,.18)}
  .tb.hot{border-color:var(--wood);color:var(--wood-d);background:#fdf7ee}
  .tb .k{font-size:11px;color:#fff;background:var(--wood);border-radius:4px;padding:1px 5px;font-family:ui-monospace,monospace}
  .search{flex:0 0 220px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;padding:0 10px;color:var(--ink2);font-size:13px;gap:6px}
  .body{flex:1;display:flex;min-height:0;padding:var(--s3);gap:var(--s3)}
  /* sidebar 分类（P2/P7/P13 统一语言） */
  .sidebar{width:200px;background:var(--panel);border:1px solid var(--line);border-radius:var(--p-radius);padding:var(--s2);display:flex;flex-direction:column;gap:2px;flex:none;overflow:auto}
  .sidebar .cat{padding:7px 10px;border-radius:7px;font-size:var(--fs-body);color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .sidebar .cat:hover{background:#f3ebd9}
  .sidebar .cat.on{background:var(--wood);color:#fff;font-weight:600}
  .sidebar .cat .n{font-size:11px;opacity:.7}
  .sidebar .search{flex:none;margin-bottom:6px}
  /* 列表（右主区） */
  .list{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--p-radius);overflow:auto;padding:var(--s2);display:flex;flex-direction:column;gap:var(--s2)}
  .row{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s3);border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;transition:all .12s}
  .row:hover{border-color:var(--wood);transform:translateY(-1px);box-shadow:0 2px 6px rgba(138,90,46,.14)}
  .row .t{font-size:var(--fs-body);font-weight:600}
  .row .d{font-size:var(--fs-cap);color:var(--ink2);margin-top:2px}
  .row .badge{margin-left:auto;font-size:11px;background:#f3ebd9;color:var(--wood-d);border-radius:10px;padding:2px 8px;white-space:nowrap}
  /* 面板（大师库同源） */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--p-radius);display:flex;flex-direction:column;overflow:hidden}
  .panel-h{height:var(--p-head-h);display:flex;align-items:center;padding:0 var(--s3);border-bottom:1px solid var(--line);font-size:var(--fs-body);font-weight:600;color:var(--ink2);gap:var(--s2);cursor:pointer;flex:none}
  .panel-h:hover{background:#f6efe0}
  .panel-h .tab{width:3px;height:14px;background:var(--wood);border-radius:2px}
  .panel-h .chev{margin-left:auto;font-size:10px;color:var(--ink2)}
  .panel-b{padding:var(--s2) var(--s3);font-size:var(--fs-body);line-height:1.8;overflow:auto}
  /* 棋盘组件（P1 语言） */
  .board{background:var(--wood);border:5px solid var(--wood-d);border-radius:10px;box-shadow:0 8px 28px rgba(90,60,20,.25)}
  .grid{display:grid}
  .cell{position:relative}.cell::after{content:"";position:absolute;inset:8%;border:1px solid rgba(255,248,230,.35);border-radius:6px}
  .pc{position:absolute;inset:8%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:#fdf3dc;border:2px solid #caa;box-shadow:0 1px 2px rgba(0,0,0,.3);color:var(--accent)}
  .pc.b{background:#3a332a;border-color:#111;color:#eee}
  /* tab 组（P3/P4 右面板三 tab） */
  .tabs{display:flex;gap:var(--s1);padding:var(--s2) var(--s3) 0}
  .tabs .t2{padding:6px 12px;font-size:var(--fs-body);border-radius:8px 8px 0 0;cursor:pointer;color:var(--ink2);border:1px solid transparent}
  .tabs .t2:hover{background:#f3ebd9}
  .tabs .t2.on{background:var(--panel);border:1px solid var(--line);border-bottom-color:var(--panel);color:var(--wood-d);font-weight:600}
  /* 卡片（P5/P11/P12） */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s3);overflow:auto;flex:1;align-content:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--p-radius);padding:var(--s3);cursor:pointer;transition:all .12s;display:flex;flex-direction:column;gap:var(--s2)}
  .card:hover{border-color:var(--wood);transform:translateY(-2px);box-shadow:0 4px 12px rgba(138,90,46,.16)}
  .card.hero{grid-column:1/-1;flex-direction:row;align-items:center;background:linear-gradient(120deg,#fdf7ee,#f7ecd7);border-color:var(--wood)}
  .card .ic{font-size:26px}
  .card .t{font-size:var(--fs-title);font-weight:700}
  .card .d{font-size:var(--fs-cap);color:var(--ink2);line-height:1.6}
  .card .go{margin-left:auto;background:var(--wood);color:#fff;border-radius:14px;font-size:12px;padding:6px 14px;white-space:nowrap}
  /* 进度/步骤（P5/P6） */
  .steps{display:flex;gap:var(--s2)}
  .step{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--p-radius);padding:var(--s3);text-align:center}
  .step.on{border-color:var(--gold);background:#fdf8ea}
  .step .n{font-size:18px;font-weight:800;color:var(--wood-d)}
  .step .t{font-size:var(--fs-body);font-weight:600;margin-top:4px}
  .step .d{font-size:var(--fs-cap);color:var(--ink2);margin-top:2px}
  .bar{height:8px;background:#eee5d2;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--wood);border-radius:4px}
  /* 棋树（P8） */
  .tree{flex:0 0 320px;background:var(--panel);border:1px solid var(--line);border-radius:var(--p-radius);overflow:auto;padding:var(--s2)}
  .tn{display:flex;gap:8px;padding:4px 8px;border-radius:6px;font-family:ui-monospace,monospace;font-size:12.5px;cursor:pointer;align-items:center}
  .tn:hover{background:#f3ebd9}.tn.on{background:var(--gold);color:#fff}
  .tn .in{width:14px;color:var(--ink2);font-size:10px}
  .tn .ev{margin-left:auto;font-size:11px;color:var(--ink2)}
  /* 图表（P11） */
  .chart{height:90px;background:#fff;border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden}
  .chart svg{position:absolute;inset:0;width:100%;height:100%}
  .radar{width:110px;height:110px;flex:none}
  .stat{display:flex;justify-content:space-between;font-size:var(--fs-cap);color:var(--ink2);padding:2px 0}
  .stat .v{color:var(--ink)}
  .dot-ok{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
  .moves{font-family:ui-monospace,monospace;font-size:12.5px}
  .mvrow{display:grid;grid-template-columns:28px 1fr 1fr;padding:2px 6px;border-radius:6px;cursor:pointer;line-height:1.7}
  .mvrow:hover{background:#f3ebd9}.mvrow.cur{background:var(--gold);color:#fff}.mvrow.cur .no{color:#fff}
  .no{color:var(--ink2)}
  .note{position:fixed;bottom:8px;left:158px;right:8px;z-index:99;background:rgba(44,36,24,.94);color:#f3ecd9;border-radius:11px;padding:7px 14px;font-size:12px;line-height:1.6;text-align:center}
  .note b{color:var(--gold)}
  .win{background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
  .win .wh{height:34px;background:#eee7d6;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--ink2);gap:8px;flex:none}
  .evalbar{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--ink) 38%,#e8ddc4 38%);border:1px solid var(--line)}
</style>
</head>
<body>
<div id="nav"><div class="brand">v6.4 · 14 页<br><span style="font-weight:400;font-size:10px;color:#cfc4ac">P1 已定稿</span></div></div>
<div class="stage" id="stage"></div>
<div class="note" id="note"></div>
<script>
/* ============ 共用资产 ============ */
const rows='rnbakabnr__________c_____c_p_p_p_p______________________P_P_P_P_P_C_____C__________RNBAKABNR'.slice(0,90).split('');
const zh={r:'車',n:'馬',b:'象',a:'士',k:'將',c:'砲',p:'卒',R:'車',N:'馬',B:'相',A:'仕',K:'帥',C:'炮',P:'兵'};
function boardHTML(){return '<div class="board"><div class="grid bd"></div></div>'}
function buildBoards(root){root.querySelectorAll('.grid.bd').forEach(g=>{g.innerHTML='';
  for(let i=0;i<90;i++){const c=document.createElement('div');c.className='cell';
    const ch=rows[i];if(ch&&ch!=='_'){const p=document.createElement('div');p.className='pc'+(i<45?' b':'');p.textContent=zh[ch]||'?';c.appendChild(p);}
    g.appendChild(c);}
  const zone=g.closest('.z2')||g.parentElement.parentElement;
  function fit(){const W=zone.clientWidth-16,H=zone.clientHeight-16;
    const cell=Math.max(16,Math.floor(Math.min((W-14)/9,(H-14)/10)));
    g.style.gridTemplateColumns=`repeat(9,${cell}px)`;g.style.gridTemplateRows=`repeat(10,${cell}px)`;
    const b=g.parentElement,pad=Math.max(Math.min(W,H)*0.04,cell*0.45);b.style.padding=`${Math.min(pad,12)}px`;
    g.querySelectorAll('.pc').forEach(p=>p.style.fontSize=Math.round(cell*0.5)+'px');}
  new ResizeObserver(fit).observe(zone);setTimeout(fit,30);});}
function movesHTML(n,start){let h='';for(let i=0;i<n;i++){h+=`<div class="mvrow${i===start?' cur':''}"><span class="no">${i+1}.</span><span>炮二平五</span><span>马8进7</span></div>`}return h}
const evalSVG='<svg viewBox="0 0 200 60" preserveAspectRatio="none"><polyline points="0,30 20,26 40,32 60,18 80,34 100,22 120,38 140,20 160,30 180,14 200,26" fill="none" stroke="#b07a45" stroke-width="2"/></svg>';
const radarSVG='<svg viewBox="0 0 100 100"><polygon points="50,8 88,35 74,80 26,80 12,35" fill="none" stroke="#d4c8b0"/><polygon points="50,20 76,39 67,70 33,68 24,39" fill="rgba(176,122,69,.35)" stroke="#b07a45"/><line x1="50" y1="50" x2="50" y2="8" stroke="#e2d9c8"/><line x1="50" y1="50" x2="88" y2="35" stroke="#e2d9c8"/><line x1="50" y1="50" x2="74" y2="80" stroke="#e2d9c8"/><line x1="50" y1="50" x2="26" y2="80" stroke="#e2d9c8"/><line x1="50" y1="50" x2="12" y2="35" stroke="#e2d9c8"/></svg>';
const T=(t)=>`<div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:8px">${t}</span></div>`;
const cat=(name,n,on)=>`<div class="cat${on?' on':''}"><span>${name}</span><span class="n">${n}</span></div>`;
const panel=(title,body,grow)=>`<div class="panel"${grow?' style="flex:1"':''}><div class="panel-h"><span class="tab"></span>${title}<span class="chev">▼</span></div><div class="panel-b" style="${grow?'overflow:auto':''}">${body}</div></div>`;

/* ============ 13 页定义 ============ */
const PAGES={
P1:{t:'中国象棋 · 对局（P1 定稿 v2.1 合并）',n:'P1 对局｜棋盘最大化弹性吃满 + 右通栏四块；<1000 收右栏（迟滞 1000/1080）；实时像素角标；职责分工=本页形势速览/P9 分析主体；⌘Z 悔棋 ⌘I 提示',h:`
 ${T('中国象棋 · 对局（人机）')}
 <div class="toolbar"><div class="tb hot">🎴 新局</div><div class="tb hot">↩ 悔棋 <span class="k">⌘Z</span></div><div class="tb hot">💡 提示 <span class="k">⌘I</span></div><div class="tb hot">📈 难度·五级</div><div class="tb hot">🎯 模式·人机</div><div class="tb overflow">⋯ 溢出菜单（调速/音效/翻转…）</div></div>
 <div class="infoband" style="height:40px;display:flex;align-items:center;justify-content:center;gap:32px;background:linear-gradient(#fffdf7,#f7f0e0);border-bottom:1px solid var(--line);font-size:13px;flex:none"><span>轮到红方</span><span>第 24 回合</span><span style="font-family:ui-monospace,monospace;font-size:15px;background:var(--ink);color:var(--gold);padding:2px 12px;border-radius:6px">⏱ 00:14:32</span><span style="color:var(--ink2)">先手·五级</span></div>
 <div class="body">
  <div class="z2" style="flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative"><span style="position:absolute;top:8px;left:8px;background:rgba(44,36,24,.85);color:var(--gold);font-size:11px;font-family:ui-monospace,monospace;padding:2px 8px;border-radius:8px">棋盘自适应吃满</span><span style="position:absolute;top:8px;right:8px;background:rgba(44,36,24,.7);color:#f3ecd9;font-size:11px;padding:2px 8px;border-radius:8px">←/→ 回跳</span>${boardHTML()}</div>
  <div style="width:264px;display:flex;flex-direction:column;gap:8px;flex:none">
   ${panel('♟ 对局信息','<div class="stat"><span>回合</span><span class="v">24</span></div><div class="stat"><span>红方</span><span class="v">00:14:32</span></div><div class="stat"><span>黑方</span><span class="v">00:16:05</span></div><div class="stat"><span>用时落后</span><span class="v" style="color:var(--accent)">−1:33</span></div>')}
   ${panel('📜 走法记录','<div class="moves">'+movesHTML(8,2)+'</div><button style="position:sticky;bottom:0;align-self:flex-end;margin-top:6px;background:var(--wood);color:#fff;border:none;font-size:12px;padding:4px 12px;border-radius:12px;cursor:pointer">↩ 回到最新</button>',1)}
   ${panel('📊 分析','<div style="display:flex;flex-direction:column;gap:8px"><div class="evalbar"></div><div class="chart" style="height:68px">'+evalSVG+'</div><div class="stat"><span>红略优 +0.8</span><span>深度 18</span></div></div>')}
   ${panel('⚙ 引擎状态','<div class="stat"><span><span class="dot-ok"></span>引擎</span><span class="v">内嵌 Pikafish</span></div><div class="stat"><span><span class="dot-ok"></span>NNUE</span><span class="v">已加载</span></div><div class="stat"><span>路由</span><span class="v">EngineRouter 单例</span></div>')}
  </div></div>`},
P2:{t:'中国象棋 · 大师库 — 浏览（P2）',n:'P2 大师库·浏览｜sidebar 化统一语言（治横滚标签栏）+ 搜索入 sidebar 顶 + 行式列表',h:`
 ${T('中国象棋 · 大师库 — 浏览')}
 <div class="toolbar"><div class="tb hot">🔙 返回</div><div class="tb">⭐ 收藏</div><div class="tb">🕘 历史</div><div class="tb" style="margin-left:auto">📥 导入棋谱</div></div>
 <div class="body">
  <div class="sidebar"><div class="search">🔍 搜索大师/开局…</div>${cat('全部','1,248',1)}${cat('按大师','312')}${cat('按开局','486')}${cat('按年份','204')}${cat('收藏','36')}</div>
  <div class="list">
   <div class="row"><div><div class="t">胡荣华 vs 杨官璘 · 1960 全国个人赛</div><div class="d">中炮过河车对屏风马平炮兑车 · 37 回合 · 红胜</div></div><div class="badge">经典 ⭐4.9</div></div>
   <div class="row"><div><div class="t">许银川 vs 吕钦 · 1996 五羊杯</div><div class="d">飞相局对士角炮 · 41 回合 · 和棋</div></div><div class="badge">⭐4.8</div></div>
   <div class="row"><div><div class="t">王天一 vs 郑惟桐 · 2018 象甲</div><div class="d">起马局 · 28 回合 · 黑胜</div></div><div class="badge">⭐4.7</div></div>
   <div class="row"><div><div class="t">柳大华 vs 李来群 · 1984</div><div class="d">顺炮直车对横车 · 53 回合 · 红胜</div></div><div class="badge">⭐4.6</div></div>
  </div></div>`},
P3:{t:'中国象棋 · 大师库 — 播放（P3）',n:'P3 播放｜棋盘最大化 + 右三tab（信息/点评/走法）密度调优；单屏零滚动目标',h:`
 ${T('中国象棋 · 大师库 — 播放')}
 <div class="toolbar"><div class="tb hot">🔙 库</div><div class="tb">⭐ 收藏</div><div class="tb">◀ 上一步</div><div class="tb">▶ 播放</div><div class="tb">▶▶ 下一步</div><div class="tb" style="margin-left:auto">调速 1× ▾</div></div>
 <div class="body">
  <div class="z2" style="flex:1;display:flex;align-items:center;justify-content:center;min-width:0">${boardHTML()}</div>
  <div style="width:280px;display:flex;flex-direction:column;gap:8px;flex:none">
   <div class="panel" style="flex:none"><div class="tabs"><div class="t2 on">信息</div><div class="t2">点评</div><div class="t2">走法</div></div>
    <div class="panel-b"><div class="stat"><span>对局</span><span class="v">胡荣华 vs 杨官璘</span></div><div class="stat"><span>赛事</span><span class="v">1960 全国个人赛</span></div><div class="stat"><span>开局</span><span class="v">中炮过河车</span></div><div class="stat"><span>当前</span><span class="v">第 12 回合 · 黑行棋</span></div></div></div>
   ${panel('📜 走法记录','<div class="moves">'+movesHTML(8,4)+'</div>',1)}
  </div></div>`},
P4:{t:'中国象棋 · 演示页（P4 · 重点区A）',n:'P4 演示｜重点区A：三tab信息密度重排+控制条，1440×900 单屏"看棋+读评+步进"零滚动',h:`
 ${T('中国象棋 · 演示 — 大师局/残局')}
 <div class="toolbar"><div class="tb hot">🔙 列表</div><div class="tb">◀ 上一步</div><div class="tb">▶ 播放</div><div class="tb">▶▶ 下一步</div><div class="tb">🔁 重头</div><div class="tb" style="margin-left:auto">调速 1× ▾</div></div>
 <div class="body">
  <div class="z2" style="flex:1;display:flex;align-items:center;justify-content:center;min-width:0">${boardHTML()}</div>

const nav=document.getElementById('nav'),stage=document.getElementById('stage'),note=document.getElementById('note');
Object.entries(PAGES).forEach(([k,p])=>{
  const b=document.createElement('button');b.textContent=k+' '+({P1:'对局页★',P2:'大师库·浏览',P3:'库·播放',P4:'演示页',P5:'学棋中心',P6:'教程四步',P7:'开局教练',P8:'探索器',P9:'复盘·独立窗',P10:'设置',P11:'成就统计',P12:'每日挑战',P13:'残局战术',P14:'排位关于'}[k]);
  b.dataset.k=k;b.onclick=()=>{location.hash=k;};nav.appendChild(b);
  const d=document.createElement('div');d.className='page';d.id='pg'+k;d.innerHTML=p.h;stage.appendChild(d);});
function show(k){if(!PAGES[k])k='P1';
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==='pg'+k));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  const narrow='｜全局窄窗口径：sidebar 页（P2/P7/P13）复用 1000/1080 迟滞收左栏；卡片页（P5/P11/P12）auto-fill 天然弹性；P8 <1080 收右侧统计栏、<900 棋树折叠为顶部下拉；P3/P4/P9 同 P1（<1000 收右栏）｜←/→ 步进口径覆盖 P1/P3/P4/P9（全局交互规范）';
  note.innerHTML='<b>'+k+'｜</b>'+PAGES[k].n+narrow;
  buildBoards(document.getElementById('pg'+k));}
addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
