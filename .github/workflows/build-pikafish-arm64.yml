name: Build Pikafish ARM64

# 在 Apple Silicon runner 上编译完整的 arm64 Pikafish 静态库（含 NEON 优化）
# Intel Mac 无法交叉编译 entry_arm64.cpp 的 ARM NEON 汇编
#
# 产物：libpikafish.a（arm64，含 NEON）
# 下载后用 scripts/fetch-arm64-pikafish.sh 与 x86_64 版本合并为 universal binary

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/ChineseChess/Pikafish/VERSION'
    branches:
      - main

jobs:
  build-arm64:
    name: Build Pikafish arm64 (Apple Silicon)
    runs-on: macos-14
    
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Read Pikafish version
        id: pf
        run: |
          COMMIT=$(grep 'PIKAFISH_COMMIT=' src/ChineseChess/Pikafish/VERSION | cut -d= -f2)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "Pikafish commit: $COMMIT"

      - name: Clone Pikafish source
        run: |
          git clone --depth 1 https://github.com/official-pikafish/Pikafish.git /tmp/pikafish-src
          cd /tmp/pikafish-src
          git fetch --depth 100 origin ${{ steps.pf.outputs.commit }}
          git checkout ${{ steps.pf.outputs.commit }}
          echo "=== Pikafish 源码结构 ==="
          ls src/
          echo "=== entry_arm64 确认 ==="
          find src/ -name "entry_arm64*" -o -name "*neon*" 2>/dev/null

      - name: Build arm64 static library
        run: |
          PIKAFISH_SRC="/tmp/pikafish-src/src"
          OUTPUT_DIR="${{ github.workspace }}/src/ChineseChess/Pikafish"
          
          DEPLOYMENT_TARGET="13.0"
          TARGET="arm64-apple-macosx${DEPLOYMENT_TARGET}"
          COMMON_FLAGS="-std=c++17 -O3 -fPIC -DNDEBUG -DIS_64BIT -fexceptions"
          PLATFORM_FLAGS="-target ${TARGET} -isysroot $(xcrun --sdk macosx --show-sdk-path)"
          
          # 源文件（排除 main/benchmark/test/example）
          SOURCES=$(find "$PIKAFISH_SRC" -name "*.cpp" \
            | grep -v "_test.cpp" \
            | grep -v "benchmark.cpp" \
            | grep -v "main.cpp" \
            | grep -v "example.cpp")
          
          echo "=== 编译 arm64 (含 NEON) ==="
          echo "源文件数: $(echo "$SOURCES" | wc -l | tr -d ' ')"
          
          BUILD_DIR="/tmp/pikafish-build"
          mkdir -p "$BUILD_DIR"
          
          OBJ_FILES=""
          FAILED=0
          for src in $SOURCES; do
            OBJ="$BUILD_DIR/$(basename "${src%.cpp}").o"
            if clang++ $COMMON_FLAGS $PLATFORM_FLAGS \
              -I"$PIKAFISH_SRC" \
              -I"$OUTPUT_DIR/include" \
              -c "$src" -o "$OBJ" 2>&1; then
              OBJ_FILES="$OBJ_FILES $OBJ"
            else
              echo "⚠️ Failed: $(basename $src)"
              FAILED=$((FAILED+1))
            fi
          done
          
          SUCCESS=$(echo "$OBJ_FILES" | wc -w | tr -d ' ')
          echo "编译完成: 成功 $SUCCESS, 失败 $FAILED"
          
          # 创建静态库
          LIB_PATH="$OUTPUT_DIR/lib/macos-arm64-ci/libpikafish.a"
          mkdir -p "$(dirname "$LIB_PATH")"
          ar rcs "$LIB_PATH" $OBJ_FILES
          
          echo "=== 验证 ==="
          lipo -info "$LIB_PATH"
          ls -la "$LIB_PATH" | awk '{print "Size:", $5, "bytes"}'
          echo "=== entry_arm64 符号 ==="
          nm "$LIB_PATH" | grep "entry_arm64" | head -3 || echo "(未找到)"
          
          rm -rf "$BUILD_DIR"
          
          {
            echo "## Pikafish ARM64 NEON Build"
            echo "- **Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- **Runner**: $(uname -m) - $(sysctl -n machdep.cpu.brand_string)"
            echo "- **Pikafish**: ${{ steps.pf.outputs.commit }}"
            echo "- **Size**: $(stat -f%z "$LIB_PATH") bytes"
            echo "- **Objects**: $SUCCESS compiled, $FAILED failed"
          } > build-info.md
          cat build-info.md

      - name: Upload arm64 library
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-arm64-neon
          path: |
            src/ChineseChess/Pikafish/lib/macos-arm64-ci/libpikafish.a
            build-info.md
          retention-days: 90
