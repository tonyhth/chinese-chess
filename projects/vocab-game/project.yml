name: VocabGame
options:
  bundleIdPrefix: com.devteam
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  VocabGame:
    type: application
    platform: [iOS, macOS]
    sources:
      - VocabGame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devteam.vocabgame
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "背单词"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
    resources:
      - path: VocabGame/Resources
    postCompileScripts:
      - name: Generate Wordlist
        script: |
          cd "$PROJECT_DIR/scripts"
          if [ ! -f "../VocabGame/Resources/Data/wordlist.json" ] || [ "../data/wordlist.md" -nt "../VocabGame/Resources/Data/wordlist.json" ]; then
            python3 generate_wordlist.py ../data/wordlist.md ../VocabGame/Resources/Data/wordlist.json
          fi
        inputFiles:
          - $(PROJECT_DIR)/data/wordlist.md
        outputFiles:
          - $(PROJECT_DIR)/VocabGame/Resources/Data/wordlist.json

  VocabGameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VocabGameTests
    dependencies:
      - target: VocabGame_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devteam.vocabgame.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
